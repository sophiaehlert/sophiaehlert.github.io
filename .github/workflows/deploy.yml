name: Deploy Vite Site to Main Pages Root

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy-step.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Combined step installs Node 20 + pnpm with safety caching built in
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 9
          runtime: node@20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: pages-deploy-step
        uses: actions/deploy-pages@v4
